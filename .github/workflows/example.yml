name: Example Publish

"on":
  # Quick-start mode: run this workflow manually from the GitHub UI.
  workflow_dispatch:
  # Run from another workflow
  workflow_call:
  # To publish automatically on Git tag pushes/releases, uncomment the
  # `push.tags` block below.
  # push:
  #   tags:
  #     - "*"

permissions:
  contents: read

env:
  # Publishes to GHCR in the current repository owner/project name.
  IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-demo
  LATEST_TAG: latest

jobs:
  build:
    name: Build image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    outputs:
      digest_amd64: ${{ steps.out-amd64.outputs.digest }}
      digest_arm64: ${{ steps.out-arm64.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          # Replace this with `Dockerfile` when you want to build your own image.
          file: >-
            https://raw.githubusercontent.com/gh-workflow/multiarch-image-publish/main/tests/build/Dockerfile
          push: true  # Push the arch image so provenance is published.
          provenance: true
          platforms: ${{ matrix.platform }}
          # Temporary image tag for build/test; final tags are published later.
          tags: ${{ env.IMAGE_REF }}:${{ github.run_id }}-${{ matrix.arch }}-test

      - name: Remove temporary tag on image (optional)
        uses: ghcr-manager/ghcr-untag-action@952822b03f7c536658dd68fb17f802f52451276e  # v1.0.8
        with:
          token: ${{ github.token }}
          owner: ${{ github.repository_owner }}
          package: ${{ github.event.repository.name }}-demo
          tags: ${{ github.run_id }}-${{ matrix.arch }}-test

      - name: Test image
        # Example smoke test: run the image and assert simple output.
        # Replace this with a real test for your own container.
        env:
          TEST_IMAGE: ${{ env.IMAGE_REF }}@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            "${TEST_IMAGE}" \
            -ec 'echo hello-world' \
            | grep -q '^hello-world$'

      - name: Export digest (amd64)
        id: out-amd64
        if: matrix.arch == 'amd64'
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "digest=${BUILD_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Export digest (arm64)
        id: out-arm64
        if: matrix.arch == 'arm64'
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "digest=${BUILD_DIGEST}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish multi-arch image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch image
        uses: gh-workflow/multiarch-image-publish@0.2.3  # zizmor: ignore[unpinned-uses]
        with:
          image_ref: ${{ env.IMAGE_REF }}
          # Image tag list:
          # - github.ref_name:
          #   - On workflow_dispatch equals the branch name.
          #   - On a git tag push equals the git-tag
          # - env.LATEST_TAG:
          #   - default=latest
          tags: |
            ${{ github.ref_name }}
            ${{ env.LATEST_TAG }}
          platform_digests: |
            linux/amd64=${{ needs.build.outputs.digest_amd64 }}
            linux/arm64=${{ needs.build.outputs.digest_arm64 }}
          publish_platform_tags: "true"
          annotations: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Print result
        env:
          VERSION_IMAGE: ${{ env.IMAGE_REF }}:${{ github.ref_name }}
          LATEST_IMAGE: ${{ env.IMAGE_REF }}:${{ env.LATEST_TAG }}
        run: |
          echo "Published ${VERSION_IMAGE}"
          echo "Published ${LATEST_IMAGE}"
